name: Sketchbook
options:
  bundleIdPrefix: vn.ctxdn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    # Điền Team ID Apple Developer của CTXĐN khi ký bản cài thật (để trống: build không ký trên CI).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
targets:
  Sketchbook:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sketchbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.ctxdn.vetranh
        INFOPLIST_FILE: Sketchbook/App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  SketchbookUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - SketchbookUITests
    dependencies:
      - target: Sketchbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.ctxdn.vetranh.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Sketchbook
schemes:
  Sketchbook:
    build:
      targets:
        Sketchbook: all
        SketchbookUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SketchbookUITests
